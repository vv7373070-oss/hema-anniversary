<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hema 💙 Venkat | Infinite</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:black;color:white;overflow-x:hidden;text-align:center;}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
}

h1{font-size:45px;margin-bottom:20px;}
p{max-width:800px;line-height:1.8;font-size:18px;}

.gallery img{
width:250px;height:300px;
object-fit:cover;border-radius:15px;
margin:10px;cursor:pointer;
transition:0.4s;
}
.gallery img:hover{transform:scale(1.1);}

#lightbox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}
#lightbox img{
max-width:80%;
max-height:80%;
border-radius:20px;
}

button{
padding:12px 25px;
border:none;border-radius:30px;
background:#00f0ff;color:black;
font-weight:bold;cursor:pointer;
margin-top:20px;
}

.hidden-message{
position:fixed;
bottom:10px;
right:10px;
font-size:12px;
color:#555;
cursor:pointer;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<section>
<h1>Happy 2nd Anniversary 💙</h1>
<h2>Hema Dharshini ❤️</h2>
<p id="typing"></p>
<button onclick="startMusic()">Play Our Song 🎵</button>
</section>

<section>
<h1>Our Beautiful Moments 📸</h1>
<div class="gallery">
<img src="photo1.jpg" onclick="openLightbox(this)">
<img src="photo2.jpg" onclick="openLightbox(this)">
<img src="photo3.jpg" onclick="openLightbox(this)">
<img src="photo4.jpg" onclick="openLightbox(this)">
<img src="photo5.jpg" onclick="openLightbox(this)">
</div>
</section>

<div id="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<div class="hidden-message" onclick="secretMessage()">
💙
</div>

<audio id="music" src="yourmusic.mp3" loop></audio>

<script>
// 🌌 STAR GALAXY BACKGROUND
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<200;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
radius:Math.random()*2
});
}

function drawStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
ctx.fill();
});
}
setInterval(drawStars,50);

// ⌨ TYPING EFFECT
let text="Hema, these 2 years are the most beautiful part of my life. You are my peace, my happiness, and my forever. I love you endlessly 💙";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,40);
}
}
type();

// 🎵 MUSIC
function startMusic(){
document.getElementById("music").play();
}

// 🖼 LIGHTBOX
function openLightbox(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}
function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

// 💌 SECRET MESSAGE
function secretMessage(){
alert("You found the hidden message 💙\nForever starts and ends with you ❤️");
}
</script>

</body>
</html>
