<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Venkat ❤️ Hema</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
overflow:hidden;
font-family:'Montserrat',sans-serif;
color:white;
background:black;
text-align:center;
}

/* UNIVERSE */
canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

/* CENTER */
.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* HEART OPEN EFFECT */
.heart-container{
position:relative;
width:150px;
height:150px;
margin:auto;
}

.heart-half{
position:absolute;
width:75px;
height:150px;
background:red;
border-radius:75px 75px 0 0;
}

.left{
left:0;
transform-origin:right;
animation:openLeft 2s forwards;
}

.right{
right:0;
transform-origin:left;
animation:openRight 2s forwards;
}

@keyframes openLeft{
0%{transform:rotate(0);}
100%{transform:rotate(-45deg);}
}

@keyframes openRight{
0%{transform:rotate(0);}
100%{transform:rotate(45deg);}
}

/* TEXT */
.names{
font-family:'Playfair Display',serif;
font-size:40px;
margin-top:20px;
opacity:0;
transition:opacity 2s;
}

.message{
font-size:28px;
margin-top:20px;
}

.countdown{
margin-top:15px;
font-size:20px;
}

/* GALLERY */
.gallery{
position:fixed;
bottom:40px;
width:100%;
display:flex;
justify-content:center;
gap:20px;
}

.gallery img{
width:150px;
height:200px;
object-fit:cover;
border-radius:15px;
opacity:0;
transform:translateY(50px);
transition:all 1s ease;
}

/* FIREWORKS */
.firework{
position:fixed;
width:5px;
height:5px;
border-radius:50%;
}

button{
margin-top:25px;
padding:10px 25px;
border-radius:30px;
border:none;
background:#ff4d6d;
color:white;
cursor:pointer;
font-size:16px;
}

/* KISS */
.kiss{
position:fixed;
font-size:25px;
animation:fall 5s linear infinite;
}
@keyframes fall{
0%{transform:translateY(-10vh);}
100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="center">
<div class="heart-container">
<div class="heart-half left"></div>
<div class="heart-half right"></div>
</div>

<div class="names" id="names">Venkat ❤️ Hema</div>
<div class="message" id="typing"></div>
<div class="countdown" id="countdown"></div>
<button onclick="marryMe()">Will You Marry Me? 💍</button>
</div>

<div class="gallery">
<img src="photo1.jpg" id="p1">
<img src="photo2.jpg" id="p2">
<img src="photo3.jpg" id="p3">
<img src="photo4.jpg" id="p4">
<img src="photo5.jpg" id="p5">
</div>

<audio id="music" src="yourmusic.mp3" loop></audio>

<script>
// STARS
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<300;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2});
}
function drawStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
});
}
setInterval(drawStars,50);

// SEQUENCE
setTimeout(()=>{document.getElementById("names").style.opacity=1;},2000);

// TYPING EFFECT
let text="Happy 2 Beautiful Years My Love 💙 Forever Begins With You.";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,50);
}}
setTimeout(type,3000);

// COUNTDOWN
function updateCountdown(){
let start=new Date("2024-02-20"); // change your real date
let now=new Date();
let diff=Math.floor((now-start)/(1000*60*60*24));
document.getElementById("countdown").innerText=diff+" Days Together ❤️";
}
setInterval(updateCountdown,1000);
updateCountdown();

// PHOTO CINEMATIC
setTimeout(()=>{document.getElementById("p1").style.opacity=1;document.getElementById("p1").style.transform="translateY(0)";},5000);
setTimeout(()=>{document.getElementById("p2").style.opacity=1;document.getElementById("p2").style.transform="translateY(0)";},6000);
setTimeout(()=>{document.getElementById("p3").style.opacity=1;document.getElementById("p3").style.transform="translateY(0)";},7000);
setTimeout(()=>{document.getElementById("p4").style.opacity=1;document.getElementById("p4").style.transform="translateY(0)";},8000);
setTimeout(()=>{document.getElementById("p5").style.opacity=1;document.getElementById("p5").style.transform="translateY(0)";startKissRain();},9000);

// FIREWORKS
function launchFireworks(){
for(let i=0;i<200;i++){
let f=document.createElement("div");
f.className="firework";
f.style.left=Math.random()*100+"vw";
f.style.top=Math.random()*50+"vh";
f.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(f);
setTimeout(()=>f.remove(),1000);
}
}

// KISS RAIN
function startKissRain(){
setInterval(()=>{
let kiss=document.createElement("div");
kiss.className="kiss";
kiss.innerHTML="😘";
kiss.style.left=Math.random()*100+"vw";
document.body.appendChild(kiss);
setTimeout(()=>kiss.remove(),5000);
},300);
}

// MARRY BUTTON
function marryMe(){
launchFireworks();
alert("She Said YES ❤️");
}

// MUSIC
document.body.addEventListener("click",function(){
document.getElementById("music").play();
},{once:true});
</script>

</body>
</html>
