<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hema 💙 Venkat | Ocean Love</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
overflow:hidden;
font-family:'Poppins',sans-serif;
color:white;
text-align:center;
background:linear-gradient(to top,#00111a,#00334d,#ff9966);
}

#photoBackground{
position:fixed;
width:100%;
height:100%;
background-size:cover;
background-position:center;
z-index:-3;
opacity:0.35;
transition:opacity 2s;
}

section{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
z-index:5;
position:relative;
}

h1{
font-size:55px;
font-family:'Playfair Display',serif;
text-shadow:0 0 25px #ff99cc;
}

p{
max-width:700px;
font-size:20px;
line-height:1.8;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff99cc;
color:black;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:white;
}

canvas{
position:fixed;
bottom:0;
left:0;
z-index:-2;
}

.heart{
position:fixed;
color:#ff4d6d;
animation:float 8s linear infinite;
z-index:5;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

#proposal{
display:none;
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
}
</style>
</head>

<body>

<div id="photoBackground"></div>
<canvas id="ocean"></canvas>

<section>
<h1>Hema Dharshini ❤️</h1>
<p>
Like the ocean waves touching the shore,<br>
my heart keeps coming back to you.<br><br>
These 2 years feel like a sunset by the beach —
peaceful, magical, infinite.
</p>

<button onclick="openProposal()">Will You Walk With Me Forever? 💍</button>
<button onclick="speakLove()">Hear My Heart 💙</button>
</section>

<div id="proposal">
<h1>Forever With You 🌊❤️</h1>
<button onclick="celebrate()">YES 💖</button>
<button onclick="closeProposal()">Always YES 💙</button>
</div>

<audio id="music" src="yourmusic.mp3" loop></audio>

<script>
// AUTO MUSIC
document.body.addEventListener("click",function(){
document.getElementById("music").play();
},{once:true});

// BACKGROUND SLIDESHOW
let images=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg"];
let i=0;
function changeBg(){
document.getElementById("photoBackground").style.backgroundImage=
"url('"+images[i]+"')";
i=(i+1)%images.length;
}
changeBg();
setInterval(changeBg,5000);

// FLOATING HEARTS
setInterval(()=>{
for(let h=0;h<6;h++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*30+15+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),8000);
}
},700);

// REAL OCEAN WAVE ANIMATION
const canvas=document.getElementById("ocean");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=250;

let waveOffset=0;

function drawOcean(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#003366";
ctx.beginPath();
ctx.moveTo(0,100);

for(let x=0;x<=canvas.width;x++){
let y=20*Math.sin((x+waveOffset)*0.02)+100;
ctx.lineTo(x,y);
}

ctx.lineTo(canvas.width,canvas.height);
ctx.lineTo(0,canvas.height);
ctx.closePath();
ctx.fill();

waveOffset+=2;
requestAnimationFrame(drawOcean);
}
drawOcean();

// PROPOSAL
function openProposal(){
document.getElementById("proposal").style.display="flex";
}
function closeProposal(){
document.getElementById("proposal").style.display="none";
}
function celebrate(){
alert("Forever Together By The Ocean 🌊💙");
closeProposal();
}

// AI VOICE
function speakLove(){
let msg="Hema, like the waves return to the shore, my heart always returns to you. I love you infinitely.";
let speech=new SpeechSynthesisUtterance(msg);
speech.rate=0.9;
window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
