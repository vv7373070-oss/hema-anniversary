<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Venkat ❤️ Hema - Season 2</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:black;
color:white;
overflow-x:hidden;
font-family:'Montserrat',sans-serif;
}

/* SMOKE OVERLAY */
.smoke{
position:fixed;
top:0;
left:0;
width:200%;
height:200%;
background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), transparent 60%);
animation:smokeMove 25s linear infinite;
pointer-events:none;
z-index:1;
}

@keyframes smokeMove{
0%{transform:translate(0,0);}
50%{transform:translate(-200px,-100px);}
100%{transform:translate(0,0);}
}

/* INTRO */
#intro{
position:fixed;
width:100%;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:100;
transition:2s;
}

.netflix{
font-family:'Cinzel',serif;
font-size:80px;
letter-spacing:10px;
color:#e50914;
animation:reveal 3s forwards;
opacity:0;
}

@keyframes reveal{
0%{letter-spacing:50px;opacity:0;filter:blur(10px);}
100%{letter-spacing:10px;opacity:1;filter:blur(0);}
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
transition:2s;
}

.hero.show{opacity:1;}

.hero h1{
font-family:'Cinzel',serif;
font-size:65px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
opacity:0.8;
}

/* SEASON TEXT */
.season{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
font-family:'Cinzel',serif;
opacity:0;
transition:2s;
}

/* MEMORIES */
.memories{
min-height:100vh;
padding:80px 20px;
text-align:center;
}

.memories h2{
font-family:'Cinzel',serif;
font-size:45px;
margin-bottom:40px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
max-width:1100px;
margin:auto;
}

.gallery img{
width:100%;
height:350px;
object-fit:cover;
border-radius:15px;
transition:0.6s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* FADE BLACK */
.fadeBlack{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:90;
opacity:0;
pointer-events:none;
transition:1.5s;
}
</style>
</head>

<body>

<div class="smoke"></div>
<div class="fadeBlack" id="fade"></div>

<div id="intro">
<div class="netflix">VENKAT</div>
</div>

<section class="hero" id="hero">
<h1>Venkat ❤️ Hema</h1>
<p>A Love Story Beyond Time</p>
</section>

<section class="season" id="season">
Season 2 Begins…
</section>

<section class="memories">
<h2>Our Beautiful Memories</h2>
<div class="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
</div>
</section>

<audio id="music" src="yourmusic.mp3" loop></audio>

<script>
// MUSIC FADE IN
function fadeInMusic(){
let music=document.getElementById("music");
music.volume=0;
music.play();
let fade=setInterval(()=>{
if(music.volume<1){
music.volume+=0.02;
}else{
clearInterval(fade);
}
},200);
}

// TRAILER VOICE
function trailerVoice(){
let msg="In a world where love changed everything... this is their story.";
let speech=new SpeechSynthesisUtterance(msg);
speech.rate=0.9;
speech.pitch=0.8;
speechSynthesis.speak(speech);
}

// FADE TRANSITION
function fadeToBlack(){
let f=document.getElementById("fade");
f.style.opacity=1;
setTimeout(()=>{f.style.opacity=0;},1500);
}

// SEQUENCE
setTimeout(()=>{
document.getElementById("intro").style.opacity=0;
fadeInMusic();
trailerVoice();
},3500);

setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("hero").classList.add("show");
fadeToBlack();
},6000);

setTimeout(()=>{
document.getElementById("season").style.opacity=1;
fadeToBlack();
},10000);
</script>

</body>
</html>
